# ==========================================================================
# Nginx - configuration PRODUCTION du portfolio
# ==========================================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Encodage : tout le site est en UTF-8
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # ---------- Securite ----------
    # Attention : un add_header dans un bloc location annule ceux du parent.
    # Les en-tetes sont donc regroupes dans un include reutilise partout.
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # ---------- Compression ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- Routage ----------
    # Permet /html/about comme /html/about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---------- Cache ----------
    # Les pages HTML : jamais mises en cache (contenu qui evolue)
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # CSS / JS : 7 jours (a passer a 1 an si un hash de version est ajoute)
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Images, polices, PDF : 30 jours
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|pdf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ---------- Divers ----------
    # Ne pas polluer les logs avec les favicon manquants
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Bloquer l'acces aux fichiers caches
    location ~ /\. { deny all; }
}
