# ==========================================================================
# Nginx - configuration DEVELOPPEMENT
# Le dossier du projet est monte en volume : aucune mise en cache, et les
# fichiers sont relus a chaque requete (modif visible avec un simple F5).
# ==========================================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # Indispensable avec un bind mount Docker Desktop (Windows / macOS) :
    # sinon Nginx peut servir une version tronquee ou perimee des fichiers.
    sendfile     off;
    open_file_cache off;
    etag         off;

    server_tokens off;

    # Aucun cache navigateur en dev
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma        "no-cache" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Autoriser la navigation dans le dossier si besoin de debug
    location = /favicon.ico { log_not_found off; access_log off; }

    location ~ /\. { deny all; }
}
