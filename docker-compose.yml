# ==========================================================================
# Portfolio Adam VAIRET
#
#   Production  : docker compose up -d --build     -> http://localhost:8081
#   Developpement : docker compose up dev          -> http://localhost:8081
#                   (modifs visibles avec un simple F5, sans rebuild)
# ==========================================================================

services:
  # ------------------------------------------------------------------
  # PROD : le site est copie dans l'image, elle est autonome
  # ------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-adam-vairet:latest
    container_name: portfolio-web
    ports:
      - "8081:80"
    restart: unless-stopped

  # ------------------------------------------------------------------
  # DEV : le dossier du projet est monte en lecture seule dans Nginx
  # Demarrer explicitement : docker compose up dev
  # ------------------------------------------------------------------
  dev:
    image: nginx:1.27-alpine
    container_name: portfolio-dev
    profiles: ["dev"]
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./html:/usr/share/nginx/html/html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    restart: unless-stopped
